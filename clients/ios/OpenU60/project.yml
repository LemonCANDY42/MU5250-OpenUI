name: OpenU60

options:
  bundleIdPrefix: com.openu60
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  SwiftOpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator
    exactVersion: 1.13.0
  SwiftOpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    exactVersion: 1.12.0
  SwiftOpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    exactVersion: 1.3.1
  SwiftHTTPTypes:
    url: https://github.com/apple/swift-http-types
    exactVersion: 1.6.0

targets:
  OpenU60:
    type: application
    platform: iOS
    sources:
      - path: SecureApp
      - path: SecureApp/openapi.yaml
      - path: Core/Components/CardView.swift
      - path: Resources
        excludes:
          - Info.plist
    dependencies:
      - package: SwiftOpenAPIRuntime
        product: OpenAPIRuntime
      - package: SwiftOpenAPIURLSession
        product: OpenAPIURLSession
      - package: SwiftHTTPTypes
        product: HTTPTypes
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: SwiftOpenAPIGenerator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openu60.app
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  OpenU60Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SecureAppTests
    dependencies:
      - target: OpenU60
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openu60.app.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  OpenU60:
    build:
      targets:
        OpenU60: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - OpenU60Tests
