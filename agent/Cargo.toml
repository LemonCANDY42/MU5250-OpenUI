[package]
name = "zte-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
argon2 = "0.5.3"
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22.1"
fs2 = "0.4.3"
libc = "0.2.183"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rustls = { version = ">=0.23.5, <0.24", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
subtle = "2.6.1"
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "signal"] }
wait-timeout = "0.2.1"

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
