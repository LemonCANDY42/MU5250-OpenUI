name: Desktop installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos-latest
            platform_tools: darwin
            archive_arch: aarch64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macos-x64
            platform: macos-latest
            platform_tools: darwin
            archive_arch: x86_64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: windows-x64
            platform: windows-latest
            platform_tools: windows
            args: --bundles msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        working-directory: installer
        run: npm ci

      - name: Fetch bundled Android platform-tools
        shell: bash
        run: |
          curl -sfL "https://dl.google.com/android/repository/platform-tools-latest-${{ matrix.platform_tools }}.zip" -o platform-tools.zip
          python -c "import zipfile; zipfile.ZipFile('platform-tools.zip').extractall('installer/assets')"
          test -f "installer/assets/platform-tools/adb" || test -f "installer/assets/platform-tools/adb.exe"
          if [ -f "installer/assets/platform-tools/adb" ]; then chmod 755 "installer/assets/platform-tools/adb"; fi

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Developer ID certificate configured; using ad-hoc signing"
            exit 0
          fi
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          CERT_ID="$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Wait for the application release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 120); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "Release $GITHUB_REF_NAME was not created in time" >&2
          exit 1

      - name: Build native installer
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: installer
          args: ${{ matrix.args }}

      - name: Build and publish native installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: installer
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

      - name: Build macOS app bundle for ZIP
        if: runner.os == 'macOS'
        working-directory: installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app

      - name: Package macOS app bundle as ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="$(find target -type d -name 'Open U60 Pro Installer.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          VERSION="$(node -p "require('./installer/package.json').version")"
          ARCHIVE="Open-U60-Pro-Installer_${VERSION}_${{ matrix.archive_arch }}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE"
          VERIFY_DIR="$RUNNER_TEMP/open-u60-pro-zip-check-${{ matrix.archive_arch }}"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$ARCHIVE" "$VERIFY_DIR"
          codesign --verify --deep --strict "$VERIFY_DIR/Open U60 Pro Installer.app"
          shasum -a 256 "$ARCHIVE"
          echo "MACOS_ZIP=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload manually triggered package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: open-u60-pro-${{ matrix.name }}
          path: |
            target/**/bundle/**/*
            Open-U60-Pro-Installer_*.app.zip
          if-no-files-found: error

      - name: Add macOS app ZIP to release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$MACOS_ZIP" --clobber
